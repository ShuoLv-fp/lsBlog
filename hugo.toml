baseURL = 'https://ShuoLv-fp.github.io/lsBlog/'
# Language settings
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
theme = "PaperMod"

# Enable robots.txt
enableRobotsTXT = true

# Build settings
buildDrafts = false
buildFuture = false
buildExpired = false

# Enable emoji
enableEmoji = true

# Pagination settings
pagination = { pagerSize = 5 }

# Language settings
[languages]
  [languages.en]
    label = "English"
    weight = 1
    title = "Shuo Lv / Field Notes"
    description = "Research notes, practical experience, and life beyond the lab."
    [languages.en.params]
      author = "Shuo Lv"
      
      # Home page information
      [languages.en.params.homeInfoParams]
        Title = "A working notebook for research, code, and unfinished questions."
        Content = """
Research summaries, practical experience, and occasional notes from life beyond the lab.
        """
      
      # Social icons
      [[languages.en.params.socialIcons]]
        name = "github"
        url = "https://github.com/ShuoLv-fp"
      
      [[languages.en.params.socialIcons]]
        name = "twitter"
        url = "https://x.com/aa_blueshark"

# Menu settings
[languages.en.menu]
  [[languages.en.menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "categories/"
    weight = 10
  
  [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "tags/"
    weight = 20
  
  [[languages.en.menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "archives/"
    weight = 30
  
  [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    url = "search/"
    weight = 40

# Main content settings
[params]
  mainSections = ["notes"]
  # Environment settings
  env = "production"
  
  # Theme settings
  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  description = "Research notes, practical experience, and life beyond the lab."
  notebookHomeTitle = "A working notebook for research, code, and unfinished questions."
  notebookHomeDescription = "Research summaries, practical experience, and occasional notes from life beyond the lab."
  personalHomepage = "https://ShuoLv-fp.github.io/"
  authorImage = "https://ShuoLv-fp.github.io/images/profile_202609.png"
  notebookCategories = [
    { key = "research-synthesis", label = "Research Synthesis", description = "Literature, methods, and research notes." },
    { key = "personal-experience", label = "Personal Experience", description = "Applications, engineering practice, and lessons learned." },
    { key = "Life & Elsewhere", label = "Life & Elsewhere", description = "Notes from outside the lab." }
  ]
  
  # Enable archive page
  disableArchive = false
  
  # Show taxonomy terms (categories and tags)
  showtoc = true
  ShowTaxonomies = true
  
  # Search Configuration
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.label]
    text = "Shuo Lv / Field Notes"

  [params.assets]
    favicon = "https://ShuoLv-fp.github.io/assets/icons/favicon-32x32_new.png"
    favicon16x16 = "https://ShuoLv-fp.github.io/assets/icons/favicon-16x16_new.png"
    favicon32x32 = "https://ShuoLv-fp.github.io/assets/icons/favicon-32x32_new.png"
    apple_touch_icon = "https://ShuoLv-fp.github.io/assets/icons/apple-touch-icon_new.png"
    safari_pinned_tab = "https://ShuoLv-fp.github.io/assets/icons/academic-icon_new.svg"
    theme_color = "#fbfcfe"
    msapplication_TileColor = "#fbfcfe"

# Markdown rendering settings
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Taxonomy settings
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"
