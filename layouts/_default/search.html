{{- define "main" }}
<section class="notebook-search" aria-labelledby="search-title">
    <header class="page-header notebook-page-header">
        <p class="notebook-page-header__eyebrow">Notebook index</p>
        <h1 id="search-title">{{ .Title }}</h1>
        {{- with .Description }}<p class="post-description">{{ . }}</p>{{ end }}
    </header>
    <div id="searchbox">
        <input id="searchInput" autofocus placeholder="{{ .Params.placeholder }}" aria-label="Search field notes" type="search" autocomplete="off" maxlength="64">
        <p id="searchStatus" class="search-status" role="status" aria-live="polite"></p>
        <ul id="searchResults" aria-label="Search results"></ul>
    </div>
</section>
{{- end }}
